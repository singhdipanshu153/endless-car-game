<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endless Car Racing</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

#score{
    position:fixed;
    top:15px;
    left:15px;
    color:white;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 5px #000;
    z-index:5;
}

#gameover{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    color:white;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:20;
}

#gameover h1{
    font-size:50px;
    margin:10px;
}

#gameover button{
    padding:14px 30px;
    font-size:20px;
    border:0;
    border-radius:10px;
}

.controls{
    position:fixed;
    bottom:25px;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:0 25px;
    z-index:10;
}

.controls button{
    width:75px;
    height:75px;
    border-radius:50%;
    border:2px solid white;
    background:rgba(0,0,0,.5);
    color:white;
    font-size:32px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="score">Score: 0</div>

<div id="gameover">
    <h1>GAME OVER</h1>
    <p id="finalScore"></p>
    <button onclick="restart()">PLAY AGAIN</button>
</div>

<div class="controls">
    <button onclick="left()">◀</button>
    <button onclick="right()">▶</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;

function resize(){
    W=canvas.width=innerWidth;
    H=canvas.height=innerHeight;
}

resize();
window.addEventListener("resize",resize);

let playerLane=0;
let enemies=[];
let score=0;
let gameSpeed=0.006;
let running=true;


/* ---------------- ROAD ---------------- */

function roadWidth(p){
    return 120 + p*p*W*0.9;
}

function roadX(p,lane){

    let center=W/2;

    let width=roadWidth(p);

    return center + lane*width*0.30;
}


/* ---------------- BACKGROUND ---------------- */

function background(){

    // sky
    let sky=ctx.createLinearGradient(0,0,0,H*.55);

    sky.addColorStop(0,"#55aaff");
    sky.addColorStop(1,"#d9f3ff");

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);

    // sun
    ctx.beginPath();
    ctx.arc(W*.8,H*.13,45,0,Math.PI*2);
    ctx.fillStyle="#fff1a8";
    ctx.fill();

    // mountains
    ctx.fillStyle="#71828d";

    ctx.beginPath();

    ctx.moveTo(0,H*.40);
    ctx.lineTo(W*.15,H*.22);
    ctx.lineTo(W*.30,H*.40);

    ctx.lineTo(W*.48,H*.18);
    ctx.lineTo(W*.68,H*.40);

    ctx.lineTo(W*.84,H*.23);
    ctx.lineTo(W,H*.40);

    ctx.closePath();

    ctx.fill();

    // grass
    ctx.fillStyle="#4d963b";
    ctx.fillRect(0,H*.40,W,H*.60);
}


/* ---------------- ROAD ---------------- */

function road(){

    let horizon=H*.40;

    // road
    ctx.beginPath();

    ctx.moveTo(W*.48,horizon);
    ctx.lineTo(W*.52,horizon);

    ctx.lineTo(W,H);
    ctx.lineTo(0,H);

    ctx.closePath();

    let g=ctx.createLinearGradient(0,horizon,0,H);

    g.addColorStop(0,"#555");
    g.addColorStop(1,"#161616");

    ctx.fillStyle=g;
    ctx.fill();


    // road edges

    ctx.strokeStyle="#fff";
    ctx.lineWidth=5;

    ctx.beginPath();
    ctx.moveTo(W*.48,horizon);
    ctx.lineTo(0,H);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(W*.52,horizon);
    ctx.lineTo(W,H);
    ctx.stroke();


    // lane lines

    for(let i=0;i<14;i++){

        let p=((i/14 + roadMove)%1);

        let y=horizon + p*(H-horizon);

        let width=roadWidth(p);

        let lineSize=5+p*35;

        ctx.fillStyle="#fff";

        let x1=W/2-width*.15;

        let x2=W/2+width*.15;

        ctx.fillRect(x1-lineSize/2,y,lineSize,lineSize*2);

        ctx.fillRect(x2-lineSize/2,y,lineSize,lineSize*2);
    }
}

let roadMove=0;


/* ---------------- TREES ---------------- */

function tree(x,y,size){

    ctx.fillStyle="#59351d";

    ctx.fillRect(
        x-size*.08,
        y-size*.7,
        size*.16,
        size*.7
    );

    ctx.fillStyle="#17652a";

    ctx.beginPath();

    ctx.arc(
        x,
        y-size*.8,
        size*.45,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        x-size*.3,
        y-size*.65,
        size*.35,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        x+size*.3,
        y-size*.65,
        size*.35,
        0,
        Math.PI*2
    );

    ctx.fill();
}


function scenery(){

    for(let i=0;i<15;i++){

        let p=((i/15 + roadMove*.7)%1);

        let y=H*.40+p*(H*.60);

        let rw=roadWidth(p);

        let size=12+p*55;

        tree(
            W/2-rw/2-size,
            y,
            size
        );

        tree(
            W/2+rw/2+size,
            y,
            size
        );
    }
}


/* ---------------- CAR ---------------- */

function car(x,y,w,h,color){

    // shadow
    ctx.fillStyle="rgba(0,0,0,.45)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+h*.48,
        w*.65,
        h*.12,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    // body
    let g=ctx.createLinearGradient(
        x-w/2,
        y,
        x+w/2,
        y
    );

    g.addColorStop(0,"#111");
    g.addColorStop(.25,color);
    g.addColorStop(.55,color);
    g.addColorStop(1,"#111");

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.roundRect(
        x-w/2,
        y-h/2,
        w,
        h,
        w*.15
    );

    ctx.fill();


    // roof

    ctx.fillStyle="#222";

    ctx.beginPath();

    ctx.moveTo(
        x-w*.30,
        y-h*.10
    );

    ctx.lineTo(
        x-w*.18,
        y-h*.38
    );

    ctx.lineTo(
        x+w*.18,
        y-h*.38
    );

    ctx.lineTo(
        x+w*.30,
        y-h*.10
    );

    ctx.closePath();

    ctx.fill();


    // windows

    ctx.fillStyle="#263c4a";

    ctx.beginPath();

    ctx.moveTo(
        x-w*.22,
        y-h*.14
    );

    ctx.lineTo(
        x-w*.13,
        y-h*.32
    );

    ctx.lineTo(
        x-w*.02,
        y-h*.32
    );

    ctx.lineTo(
        x-w*.02,
        y-h*.14
    );

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        x+w*.02,
        y-h*.14
    );

    ctx.lineTo(
        x+w*.02,
        y-h*.32
    );

    ctx.lineTo(
        x+w*.13,
        y-h*.32
    );

    ctx.lineTo(
        x+w*.22,
        y-h*.14
    );

    ctx.closePath();

    ctx.fill();


    // headlights

    ctx.fillStyle="#fffbd0";

    ctx.fillRect(
        x-w*.38,
        y-h*.34,
        w*.14,
        h*.07
    );

    ctx.fillRect(
        x+w*.24,
        y-h*.34,
        w*.14,
        h*.07
    );


    // wheels

    ctx.fillStyle="#050505";

    ctx.fillRect(
        x-w*.55,
        y-h*.18,
        w*.16,
        h*.34
    );

    ctx.fillRect(
        x+w*.39,
        y-h*.18,
        w*.16,
        h*.34
    );
}


/* ---------------- ENEMY ---------------- */

function spawn(){

    enemies.push({

        lane:
        [-.30,0,.30]
        [Math.floor(Math.random()*3)],

        p:0,

        color:
        ["#168cff","#ffd21c","#eeeeee","#25b765"]
        [Math.floor(Math.random()*4)]
    });
}


/* ---------------- UPDATE ---------------- */

function update(){

    if(!running)return;

    roadMove+=gameSpeed;

    if(Math.random()<.018){
        spawn();
    }

    let playerP=.88;

    let px=roadX(playerP,playerLane);


    for(let i=enemies.length-1;i>=0;i--){

        let e=enemies[i];

        e.p+=gameSpeed;

        if(e.p>1.05){

            enemies.splice(i,1);

            score++;

            if(score%10===0){
                gameSpeed+=.001;
            }

            continue;
        }


        // perspective
        let y=H*.40+e.p*(H*.60);

        let size=18+e.p*75;

        let x=roadX(e.p,e.lane);

        let h=size*1.6;

        car(
            x,
            y,
            size,
            h,
            e.color
        );


        // collision only near player

        if(e.p>.78){

            if(
                Math.abs(x-px)<55 &&
                Math.abs(y-H*.82)<100
            ){
                gameOver();
            }
        }
    }


    document.getElementById("score").innerText=
        "Score: "+score;
}


/* ---------------- CONTROLS ---------------- */

function left(){

    if(playerLane>-.30){
        playerLane-=.30;
    }
}

function right(){

    if(playerLane<.30){
        playerLane+=.30;
    }
}

document.addEventListener("keydown",function(e){

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
        left();
    }

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
        right();
    }
});


/* ---------------- GAME OVER ---------------- */

function gameOver(){

    running=false;

    document.getElementById("finalScore").innerText=
        "Score: "+score;

    document.getElementById("gameover").style.display="flex";
}

function restart(){

    enemies=[];
    score=0;
    gameSpeed=.006;
    roadMove=0;
    playerLane=0;
    running=true;

    document.getElementById("gameover").style.display="none";
}


/* ---------------- DRAW ---------------- */

function draw(){

    background();

    road();

    scenery();

    // player car

    let py=H*.82;

    let px=roadX(.88,playerLane);

    car(
        px,
        py,
        95,
        155,
        "#e40000"
    );

    update();

    requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
