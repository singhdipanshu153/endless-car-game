<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Endless Car Game</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}
#game{
    width:100vw;
    height:100vh;
    display:block;
}
#score{
    position:fixed;
    top:20px;
    left:20px;
    color:white;
    font-size:24px;
    font-weight:bold;
    z-index:5;
    text-shadow:2px 2px 5px #000;
}
#info{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    background:rgba(0,0,0,.55);
    padding:10px 18px;
    border-radius:12px;
    z-index:5;
}
#gameover{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    color:white;
    z-index:10;
    text-align:center;
    padding-top:25vh;
}
#gameover h1{
    font-size:48px;
    margin:10px;
}
button{
    border:0;
    padding:14px 30px;
    font-size:20px;
    border-radius:12px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="score">Score: 0</div>
<div id="info">⬅️ ➡️ Arrow Keys / A D to Drive</div>

<div id="gameover">
    <h1>GAME OVER</h1>
    <p id="finalScore"></p>
    <button onclick="location.reload()">RESTART</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
    W=canvas.width=innerWidth;
    H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let car={
    x:0,
    lane:0,
    width:55,
    height:100
};

let enemies=[];
let score=0;
let speed=7;
let gameOver=false;
let roadOffset=0;

const lanes=[-1,0,1];

function laneX(lane){
    return W/2 + lane*110;
}

function drawBackground(){

    // sky
    let sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,"#16213e");
    sky.addColorStop(.5,"#496b8c");
    sky.addColorStop(1,"#9cc4d8");

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);

    // mountains
    ctx.fillStyle="#34495e";
    ctx.beginPath();
    ctx.moveTo(0,H*.45);
    ctx.lineTo(W*.2,H*.25);
    ctx.lineTo(W*.4,H*.45);
    ctx.lineTo(W*.6,H*.2);
    ctx.lineTo(W*.8,H*.45);
    ctx.lineTo(W,H*.28);
    ctx.lineTo(W,H*.55);
    ctx.lineTo(0,H*.55);
    ctx.closePath();
    ctx.fill();

    // road
    ctx.fillStyle="#252525";
    ctx.beginPath();
    ctx.moveTo(W*.25,H);
    ctx.lineTo(W*.43,H*.45);
    ctx.lineTo(W*.57,H*.45);
    ctx.lineTo(W*.75,H);
    ctx.closePath();
    ctx.fill();

    // road edges
    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=5;

    ctx.beginPath();
    ctx.moveTo(W*.25,H);
    ctx.lineTo(W*.43,H*.45);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(W*.75,H);
    ctx.lineTo(W*.57,H*.45);
    ctx.stroke();

    // lane markings
    ctx.strokeStyle="#eeeeee";
    ctx.lineWidth=6;

    for(let lane of [-.5,.5]){
        for(let y=-100;y<H;y+=120){
            let p=(y+roadOffset)%H;
            let perspective=p/H;
            let x=W/2+lane*220*perspective;
            let yy=H*.45+perspective*(H*.55);

            ctx.beginPath();
            ctx.moveTo(x,yy);
            ctx.lineTo(x,yy+45);
            ctx.stroke();
        }
    }
}

function drawCar(x,y,color="#e60000",scale=1){

    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);

    // shadow
    ctx.fillStyle="rgba(0,0,0,.4)";
    ctx.beginPath();
    ctx.ellipse(0,45,38,12,0,0,Math.PI*2);
    ctx.fill();

    // body
    let g=ctx.createLinearGradient(-30,0,30,0);
    g.addColorStop(0,"#650000");
    g.addColorStop(.45,color);
    g.addColorStop(1,"#ff5555");

    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.roundRect(-28,-50,56,100,12);
    ctx.fill();

    // roof
    ctx.fillStyle="#111";
    ctx.beginPath();
    ctx.roundRect(-21,-25,42,48,10);
    ctx.fill();

    // windows
    ctx.fillStyle="#75c9e8";

    ctx.beginPath();
    ctx.moveTo(-17,-20);
    ctx.lineTo(17,-20);
    ctx.lineTo(14,-3);
    ctx.lineTo(-14,-3);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-14,5);
    ctx.lineTo(14,5);
    ctx.lineTo(17,19);
    ctx.lineTo(-17,19);
    ctx.closePath();
    ctx.fill();

    // lights
    ctx.fillStyle="#fff";
    ctx.fillRect(-21,-48,12,6);
    ctx.fillRect(9,-48,12,6);

    // wheels
    ctx.fillStyle="#090909";
    ctx.fillRect(-34,-32,8,25);
    ctx.fillRect(26,-32,8,25);
    ctx.fillRect(-34,12,8,25);
    ctx.fillRect(26,12,8,25);

    ctx.restore();
}

function spawnEnemy(){

    let lane=lanes[Math.floor(Math.random()*3)];

    enemies.push({
        lane:lane,
        y:-120,
        speed:speed*(.7+Math.random()*.35),
        color:["#0066ff","#00aa55","#ffaa00","#9900cc"][Math.floor(Math.random()*4)]
    });
}

function update(){

    if(gameOver)return;

    roadOffset+=speed;

    if(Math.random()<.025){
        spawnEnemy();
    }

    enemies.forEach(e=>{
        e.y+=e.speed;
    });

    enemies=enemies.filter(e=>e.y<H+150);

    // collision
    enemies.forEach(e=>{

        let ex=laneX(e.lane);
        let ey=e.y;

        if(
            Math.abs(ex-laneX(car.lane))<50 &&
            Math.abs(ey-(H-120))<75
        ){
            endGame();
        }
    });

    score++;
    speed+=0.002;

    document.getElementById("score").innerText=
        "Score: "+Math.floor(score/10);
}

function draw(){

    drawBackground();

    // enemies
    enemies.forEach(e=>{
        let perspective=Math.max(.25,Math.min(1,(e.y-H*.4)/(H*.6)));
        let x=W/2+(e.lane*110*perspective);
        let scale=.35+perspective*.65;

        drawCar(x,e.y,e.color,scale);
    });

    // player
    drawCar(laneX(car.lane),H-120,"#e60000",1);

    requestAnimationFrame(draw);
}

function endGame(){

    gameOver=true;

    document.getElementById("gameover").style.display="block";

    document.getElementById("finalScore").innerText=
        "Your Score: "+Math.floor(score/10);
}

addEventListener("keydown",e=>{

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
        car.lane=Math.max(-1,car.lane-1);
    }

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
        car.lane=Math.min(1,car.lane+1);
    }
});

setInterval(update,30);
draw();
</script>

</body>
</html>
