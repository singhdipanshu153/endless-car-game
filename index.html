<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realistic Endless Car Game</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}
canvas{
    display:block;
    width:100vw;
    height:100vh;
}
#score{
    position:fixed;
    top:15px;
    left:15px;
    color:white;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 5px #000;
    z-index:5;
}
#speed{
    position:fixed;
    top:48px;
    left:15px;
    color:white;
    font-size:16px;
    text-shadow:2px 2px 4px #000;
    z-index:5;
}
#gameover{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    color:white;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:10;
}
#gameover h1{
    font-size:48px;
    margin:10px;
}
#gameover button{
    padding:14px 30px;
    font-size:20px;
    border:0;
    border-radius:10px;
    cursor:pointer;
}
.controls{
    position:fixed;
    bottom:25px;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:0 25px;
    z-index:8;
    pointer-events:none;
}
.controls button{
    pointer-events:auto;
    width:75px;
    height:75px;
    border-radius:50%;
    border:2px solid white;
    background:rgba(0,0,0,.45);
    color:white;
    font-size:35px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="score">Score: 0</div>
<div id="speed">Speed: 1</div>

<div id="gameover">
    <h1>GAME OVER</h1>
    <p id="finalScore"></p>
    <button onclick="restart()">PLAY AGAIN</button>
</div>

<div class="controls">
    <button id="left">◀</button>
    <button id="right">▶</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;

function resize(){
    W=canvas.width=innerWidth;
    H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let player={
    lane:1,
    x:0
};

let enemies=[];
let score=0;
let speed=7;
let roadMove=0;
let gameRunning=true;

const lanes=[-1,0,1];

function roadWidth(y){
    let horizon=H*.36;
    let t=(y-horizon)/(H-horizon);
    return 150 + t*W*.85;
}

function roadCenter(){
    return W/2;
}

function laneX(lane,y){
    let rw=roadWidth(y);
    return roadCenter()+lane*(rw/3);
}

function drawSky(){

    let sky=ctx.createLinearGradient(0,0,0,H*.45);
    sky.addColorStop(0,"#4da6ff");
    sky.addColorStop(1,"#dff4ff");

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);

    // sun
    ctx.beginPath();
    ctx.arc(W*.82,H*.12,45,0,Math.PI*2);
    ctx.fillStyle="rgba(255,245,180,.9)";
    ctx.fill();

    // mountains
    ctx.fillStyle="#607d8b";
    ctx.beginPath();
    ctx.moveTo(0,H*.36);
    ctx.lineTo(W*.15,H*.20);
    ctx.lineTo(W*.28,H*.36);
    ctx.lineTo(W*.45,H*.18);
    ctx.lineTo(W*.65,H*.36);
    ctx.lineTo(W*.82,H*.22);
    ctx.lineTo(W,H*.36);
    ctx.closePath();
    ctx.fill();

    // ground
    ctx.fillStyle="#4b8b3b";
    ctx.fillRect(0,H*.36,W,H*.64);
}

function drawRoad(){

    let horizon=H*.36;

    // road
    ctx.beginPath();
    ctx.moveTo(W*.46,horizon);
    ctx.lineTo(W*.54,horizon);
    ctx.lineTo(W*.98,H);
    ctx.lineTo(W*.02,H);
    ctx.closePath();

    let roadGrad=ctx.createLinearGradient(0,horizon,0,H);
    roadGrad.addColorStop(0,"#555");
    roadGrad.addColorStop(1,"#191919");

    ctx.fillStyle=roadGrad;
    ctx.fill();

    // road edges
    ctx.strokeStyle="#fff";
    ctx.lineWidth=5;

    ctx.beginPath();
    ctx.moveTo(W*.46,horizon);
    ctx.lineTo(W*.02,H);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(W*.54,horizon);
    ctx.lineTo(W*.98,H);
    ctx.stroke();

    // lane markings
    for(let i=0;i<18;i++){

        let p=((i/18)+(roadMove%1)/18)%1;

        let y=horizon+p*(H-horizon);
        let rw=roadWidth(y);

        let lineH=10+p*55;
        let gap=25+p*60;

        ctx.fillStyle="#fff";

        for(let lane=-0.5;lane<=0.5;lane+=1){

            let x=W/2+lane*rw/3;

            ctx.fillRect(
                x-3,
                y,
                6,
                lineH
            );
        }
    }
}

function drawTrees(){

    for(let i=0;i<12;i++){

        let p=((i/12)+(roadMove*.015))%1;
        let y=H*.36+p*(H*.64);
        let rw=roadWidth(y);

        let size=15+p*50;

        let leftX=W/2-rw/2-size*1.5;
        let rightX=W/2+rw/2+size*.5;

        drawTree(leftX,y,size);
        drawTree(rightX,y,size);
    }
}

function drawTree(x,y,s){

    ctx.fillStyle="#5b351c";
    ctx.fillRect(x-s*.12,y-s*.7,s*.24,s*.7);

    ctx.beginPath();
    ctx.arc(x,y-s*.9,s*.55,0,Math.PI*2);
    ctx.fillStyle="#176b2c";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x-s*.35,y-s*.7,s*.4,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x+s*.35,y-s*.7,s*.4,0,Math.PI*2);
    ctx.fill();
}

function drawCar(x,y,w,h,color){

    // shadow
    ctx.beginPath();
    ctx.ellipse(x,y+h*.48,w*.65,h*.16,0,0,Math.PI*2);
    ctx.fillStyle="rgba(0,0,0,.5)";
    ctx.fill();

    // body
    let g=ctx.createLinearGradient(x-w/2,y,x+w/2,y);
    g.addColorStop(0,"#222");
    g.addColorStop(.25,color);
    g.addColorStop(.55,color);
    g.addColorStop(1,"#111");

    ctx.fillStyle=g;

    ctx.beginPath();
    ctx.roundRect(
        x-w/2,
        y-h/2,
        w,
        h,
        w*.18
    );
    ctx.fill();

    // roof
    ctx.fillStyle="#171717";

    ctx.beginPath();
    ctx.moveTo(x-w*.32,y-h*.12);
    ctx.lineTo(x-w*.20,y-h*.40);
    ctx.lineTo(x+w*.20,y-h*.40);
    ctx.lineTo(x+w*.32,y-h*.12);
    ctx.closePath();
    ctx.fill();

    // windows
    ctx.fillStyle="#263d4a";

    ctx.beginPath();
    ctx.moveTo(x-w*.24,y-h*.16);
    ctx.lineTo(x-w*.15,y-h*.34);
    ctx.lineTo(x-w*.02,y-h*.34);
    ctx.lineTo(x-w*.02,y-h*.16);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x+w*.02,y-h*.16);
    ctx.lineTo(x+w*.02,y-h*.34);
    ctx.lineTo(x+w*.15,y-h*.34);
    ctx.lineTo(x+w*.24,y-h*.16);
    ctx.closePath();
    ctx.fill();

    // headlights
    ctx.fillStyle="#fffbd0";
    ctx.fillRect(x-w*.38,y-h*.34,w*.15,h*.08);
    ctx.fillRect(x+w*.23,y-h*.34,w*.15,h*.08);

    // wheels
    ctx.fillStyle="#050505";

    ctx.fillRect(x-w*.55,y-h*.20,w*.16,h*.35);
    ctx.fillRect(x+w*.39,y-h*.20,w*.16,h*.35);

    // bumper
    ctx.fillStyle="rgba(255,255,255,.2)";
    ctx.fillRect(x-w*.35,y+h*.34,w*.7,h*.04);
}

function spawnEnemy(){

    let lane=Math.floor(Math.random()*3)-1;

    enemies.push({
        lane:lane,
        y:H*.36,
        color:["#168cff","#ffcc00","#ffffff","#20c46b"][Math.floor(Math.random()*4)],
        speed:2+Math.random()*3
    });
}

function update(){

    if(!gameRunning)return;

    roadMove+=speed*.018;

    if(Math.random()<.025){
        spawnEnemy();
    }

    let playerY=H*.80;
    let playerX=laneX(player.lane,playerY);

    for(let i=enemies.length-1;i>=0;i--){

        let e=enemies[i];

        e.y+=e.speed+speed*.35;

        let ex=laneX(e.lane,e.y);

        let scale=(e.y-H*.36)/(H*.64);

        let ew=28+scale*70;
        let eh=50+scale*100;

        drawCar(ex,e.y,ew,eh,e.color);

        if(
            Math.abs(ex-playerX)<45 &&
            Math.abs(e.y-playerY)<80
        ){
            gameOver();
        }

        if(e.y>H+150){
            enemies.splice(i,1);
            score++;
            speed=Math.min(15,7+score*.04);
        }
    }

    document.getElementById("score").innerText="Score: "+score;
    document.getElementById("speed").innerText="Speed: "+speed.toFixed(1);
}

function draw(){

    drawSky();
    drawRoad();
    drawTrees();

    let y=H*.80;
    let x=laneX(player.lane,y);

    drawCar(x,y,90,150,"#e60000");

    update();

    requestAnimationFrame(draw);
}

function gameOver(){

    gameRunning=false;

    document.getElementById("finalScore").innerText=
        "Your Score: "+score;

    document.getElementById("gameover").style.display="flex";
}

function restart(){

    enemies=[];
    score=0;
    speed=7;
    player.lane=1;
    gameRunning=true;

    document.getElementById("gameover").style.display="none";
}

function moveLeft(){
    if(player.lane>0)player.lane--;
}

function moveRight(){
    if(player.lane<2)player.lane++;
}

addEventListener("keydown",e=>{

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
        moveLeft();
    }

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
        moveRight();
    }
});

document.getElementById("left").addEventListener("touchstart",moveLeft);
document.getElementById("right").addEventListener("touchstart",moveRight);

document.getElementById("left").addEventListener("click",moveLeft);
document.getElementById("right").addEventListener("click",moveRight);

draw();

</script>

</body>
</html>
